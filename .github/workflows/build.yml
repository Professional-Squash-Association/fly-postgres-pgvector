# Builds and publishes the image to GHCR.
#
# Runs on a version tag (e.g. `git tag 17.7-pgv0.8.5 && git push --tags`) or on
# demand. This exists mainly so that keeping up with Postgres security patches
# is a tag push rather than remembering the local buildx incantation - on a
# custom image, `fly image update` no longer tracks upstream postgres-flex
# releases, so rebuilding is on us.
name: Build and publish

on:
  push:
    tags: [ "*-pgv*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 17.7-pgv0.8.5"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Fly VMs are amd64. Only that platform is published - see the README
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail loudly if the extension did not actually make it into the image -
      # a build can succeed while putting the files somewhere Postgres will
      # never look, for instance if the server-dev package does not match the
      # base image's major version
      - name: Verify pgvector is present
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            PG_MAJOR=$(postgres --version | grep -oE "[0-9]+" | head -1)
            echo "PostgreSQL: $(postgres --version)"
            ls "/usr/lib/postgresql/${PG_MAJOR}/lib/vector.so"
            grep default_version "/usr/share/postgresql/${PG_MAJOR}/extension/vector.control"
          '
